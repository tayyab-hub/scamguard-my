# Render service blueprint for the API. Install locked backend dependencies and invoke the
# migration-before-serve wrapper; sync-disabled values must be supplied privately in hosting
# configuration. These declarations do not themselves prove a live deployment is healthy.

services:
  - type: web
    name: scamguard-capstone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -c requirements.lock .
    startCommand: python scripts/start_production.py
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PERSISTENCE_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_TOKEN_PEPPER
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Optional AI reviewer settings are owned by the dashboard (sync: false) so a blueprint
      # sync cannot switch a deliberately enabled reviewer back off. Leave unset or "false" to
      # run with local intelligence only.
      - key: AI_REVIEW_ENABLED
        sync: false
      - key: AI_REVIEW_PROVIDER
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://scamguard-my.vercel.app
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
