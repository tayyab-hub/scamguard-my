# Keep the free Render API instance from sleeping. Render spins a free web service down after
# about 15 minutes without inbound traffic, and the next visitor then waits roughly a minute for
# it to start. This job requests the liveness endpoint through the production Vercel rewrite every
# 10 minutes. /health touches no database, so Neon can still suspend and no user data is read.
# GitHub may delay or skip scheduled runs, and disables schedules after 60 days without repository
# activity; the frontend's wake-up retries remain the fallback in either case.

name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request API liveness
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 \
              https://scamguard-my.vercel.app/api/v1/health; then
              echo
              exit 0
            fi
            echo "Attempt $attempt failed; retrying while the instance starts."
            sleep 15
          done
          exit 1
