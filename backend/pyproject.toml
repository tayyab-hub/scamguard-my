[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "scamguard-api"
version = "0.1.0"
description = "SCAMGUARD core platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
  "phonenumbers==9.0.38",
  "tldextract==5.3.1",
  "idna>=3.10,<4",
  "Pillow==12.3.0",
  "python-multipart==0.0.32",
  "zxing-cpp==3.1.1",
]

[project.optional-dependencies]
ai = ["openai>=2.0,<3"]
ml = ["scikit-learn>=1.7,<2"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
  "external_ai: opt-in live external-provider smoke test; may incur cost",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
"app.url_intelligence" = ["artifacts/*.json"]
"app.ml" = ["artifacts/*.json"]
