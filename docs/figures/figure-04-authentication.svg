   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="230.4" y="52.09125" transform="rotate(-0 230.4 52.09125)">Login with username / email + password</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(126.9975 129.83025)">Rate limits + Argon2id verification</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(93.59625 144.83025)">Invalid credentials receive a generic rejection</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(103.829062 221.30625)">Create opaque session; store token digest</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(85.160625 236.30625)">Send HttpOnly cookie; return synchronizer CSRF</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(80.44875 319.01925)">Protected mutation: cookie + CSRF + exact origin</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(87.03375 334.01925)">Server derives user identity and scopes queries</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(88.231875 411.31125)">Reset: single-use, expiring digest-backed token</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(88.395937 426.31125)">Set new password and revoke all prior sessions</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(125.20125 441.31125)">Logout revokes the current session</text>
   </g>
