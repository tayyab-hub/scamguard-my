    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(94.242969 479.603375)">Production cookie: Secure, HttpOnly, SameSite=None.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(40.567969 493.603375)">The reset lifecycle is a separate recovery path, not an automatic login step.</text>
